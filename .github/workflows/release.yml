name: Release packages

# Builds a .deb and an .rpm with nfpm on every version tag and attaches them
# to the GitHub release for that tag (creating the release if needed).
# Arch users get the same version from the AUR PKGBUILD, which must be tagged
# with the same vX.Y.Z.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: "2.47.0"
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install nfpm and rpm tools
        run: |
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin nfpm
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
          nfpm --version

      - name: Build packages
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p dist
          nfpm package --config nfpm.yaml --packager deb --target dist/
          nfpm package --config nfpm.yaml --packager rpm --target dist/
          ls -l dist

      - name: Inspect packages
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          rpm -qpi dist/*.rpm
          rpm -qpl dist/*.rpm
          rpm -qpR dist/*.rpm

      - name: Smoke-test the .deb
        run: |
          sudo apt-get install -y -q ./dist/*.deb
          layerbooth --help | head -3
          layerbooth page --trims
          LAYERBOOTH_CONFIG_DIR="$RUNNER_TEMP/cfg" layerbooth --list

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Layerbooth $TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
